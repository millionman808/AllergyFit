name: AllergyFit
options:
  bundleIdPrefix: com.elischafer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 17.0.0
  TikTokBusinessSDK:
    url: https://github.com/tiktok/tiktok-business-ios-sdk
    from: 1.3.0
  AppsFlyer:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    from: 6.15.0
targets:
  AllergyFit:
    type: application
    platform: iOS
    sources:
      - AllergyFit
    info:
      path: AllergyFit/Resources/Info.plist
      properties:
        # Only standard HTTPS/TLS → exempt. Declaring it here means App Store
        # Connect never asks the export-compliance question on future builds.
        ITSAppUsesNonExemptEncryption: false
        # Without a network's SKAdNetwork ID here, StoreKit never sends that
        # network an install postback and every install looks organic to it.
        # This exact omission is why Meta reported zero installs for HearHim.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork   # Meta (Facebook)
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork   # Meta (Instagram)
          - SKAdNetworkIdentifier: 238da6jt44.skadnetwork   # TikTok
        # Meta SDK checks for these; harmless when the FB app isn't installed.
        LSApplicationQueriesSchemes: [fbapi, fb-messenger-share-api]
        GIDClientID: 774051386593-n8fe3bpri3tkr7gdb30av32afvg9kssq.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.elischafer.allergyfit
            CFBundleURLSchemes: [allergyfit]
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-signin
            CFBundleURLSchemes: [com.googleusercontent.apps.774051386593-n8fe3bpri3tkr7gdb30av32afvg9kssq]
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: FacebookSDK
        product: FacebookCore
      - package: TikTokBusinessSDK
        product: TikTokBusinessSDK
      - package: AppsFlyer
        product: AppsFlyerLib
    preBuildScripts:
      - name: Ad IDs configured
        inputFiles:
          - $(SRCROOT)/AllergyFit/Core/AdConfig.swift
        script: |
          # A Release binary declares tracking (PrivacyInfo.xcprivacy) and ships
          # the ATT usage string, so it MUST actually ask — which only happens
          # once Meta/TikTok IDs are set. Shipping without them is a 5.1.2
          # rejection and a misdeclared privacy label. Refuse to archive.
          [ "$CONFIGURATION" = "Release" ] || exit 0
          f="$SRCROOT/AllergyFit/Core/AdConfig.swift"
          # Meta is what makes the tracking declaration true; TikTok can't be
          # registered until the app is live, so it's a warning until then.
          for k in metaAppID metaClientToken; do
            if grep -Eq "static let $k = \"\"" "$f"; then
              echo "error: AdConfig.$k is empty. Paste the ID (see AdConfig.swift), or set NSPrivacyTracking to false and remove NSUserTrackingUsageDescription before shipping without ads."
              exit 1
            fi
          done
          for k in tiktokAppID tiktokAccessToken; do
            grep -Eq "static let $k = \"\"" "$f" && echo "warning: AdConfig.$k is empty — TikTok in-app events are off until the app is live and registered in Events Manager."
          done
          exit 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elischafer.allergyfit
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 14
        DEVELOPMENT_TEAM: KLD3ENRH42
        GENERATE_INFOPLIST_FILE: true
        # Siri needs a usage string before it will run the "Log a Meal" intent.
        INFOPLIST_KEY_NSSiriUsageDescription: SafeFuel uses Siri so you can log a meal by voice and hear whether it's safe for your allergies.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: SafeFuel
        INFOPLIST_KEY_NSHealthShareUsageDescription: SafeFuel reads your workouts and active energy to tune your daily nutrition targets on training days.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: SafeFuel can write the calories you log back to Apple Health so all your data stays in sync.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SafeFuel uses your photos to read blood allergy test results you choose to scan.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: SafeFuel uses this only to measure which ads brought people to the app. It is never used to profile you or share your health data.
        INFOPLIST_KEY_NSCameraUsageDescription: SafeFuel uses the camera to photograph your meals and nutrition labels, and to scan product barcodes and check them against your allergen profile.
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_ENTITLEMENTS: AllergyFit/Resources/AllergyFit.entitlements
        # Manual, scoped to THIS target only. Passing these on the xcodebuild
        # command line leaks them onto every SPM package target, which don't
        # support provisioning profiles and fail the build.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: AllergyFit App Store
